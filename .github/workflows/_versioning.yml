name: Versioning

on:
  workflow_call:
    inputs:
      bump-type:
        description: 'Increment type: patch, minor or major.'
        required: false
        type: string
        default: 'patch'
      target-version:
        description: 'Manual version override (e.g. 1.0.0). If set, skips auto-increment.'
        required: false
        type: string
        default: ''
    outputs:
      new-version:
        value: ${{ jobs.bump-version.outputs.new-version }}

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version & Tag
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.bump.outputs.new-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and bump version
        id: bump
        run: |
          echo "Current VERSION:"
          cat VERSION
          if [ -n "${{ inputs.target-version }}" ]; then
            NEW_VERSION="${{ inputs.target-version }}"
            echo "Using manual version: $NEW_VERSION"
          else
            VERSION=$(cat VERSION)
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)

            # Determine bump type:
            # - workflow_dispatch: use bump-type input
            # - automatic push: read bump type from last commit message
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              BUMP_TYPE="${{ inputs.bump-type }}"
            else
              COMMIT_MSG=$(git log -1 --pretty=%s)
              echo "Commit message: $COMMIT_MSG"
              if echo "$COMMIT_MSG" | grep -qi '\[major\]'; then
                BUMP_TYPE="major"
              elif echo "$COMMIT_MSG" | grep -qi '\[minor\]'; then
                BUMP_TYPE="minor"
              else
                BUMP_TYPE="patch"
              fi
            fi

            case "$BUMP_TYPE" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              *)
                PATCH=$((PATCH + 1))
                ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Bump type: $BUMP_TYPE → $NEW_VERSION"
          fi
          echo "$NEW_VERSION" > VERSION
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update app.json version
        run: |
          jq --arg v "${{ steps.bump.outputs.new-version }}" '.expo.version = $v' cavea-front/app.json > /tmp/app.json
          mv /tmp/app.json cavea-front/app.json

      - name: Commit and tag new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION cavea-front/app.json
          git commit -m "Bump version to ${{ steps.bump.outputs.new-version }}" || echo "No changes to commit"
          git tag -a "v${{ steps.bump.outputs.new-version }}" -m "Release v${{ steps.bump.outputs.new-version }}" || echo "Tag already exists"

      - name: Push changes and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD:main || echo "Push skipped"
          git push origin --tags || echo "Push tags skipped"
