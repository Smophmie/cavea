name: Backend and frontend CI/CD

on:
  push:
    branches: [ main, dev, feature/** ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      bump-type:
        description: 'Increment type (ignored if target-version is set)'
        required: false
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
      target-version:
        description: 'Manual version override (e.g. 1.0.0). If set, ignores bump-type.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  lint:
    uses: ./.github/workflows/_backend-lint.yml
    secrets: inherit

  backend-tests:
    needs: lint
    uses: ./.github/workflows/_backend-tests.yml
    secrets: inherit

  frontend-tests:
    needs: lint
    uses: ./.github/workflows/_frontend-tests.yml
    secrets: inherit

  sonarqube:
    needs: [backend-tests, frontend-tests]
    uses: ./.github/workflows/_repo-sonarqube.yml
    secrets: inherit

  versioning:
    needs: sonarqube
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_versioning.yml
    with:
      bump-type: ${{ inputs.bump-type || 'patch' }}
      target-version: ${{ inputs.target-version || '' }}
    secrets: inherit

  backend-build-dev:
    needs: sonarqube
    if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
    uses: ./.github/workflows/_backend-build.yml
    with:
      version: ${{ github.sha }}
    secrets: inherit

  backend-build-prod:
    needs: versioning
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/_backend-build.yml
    with:
      version: ${{ needs.versioning.outputs.new-version }}
    secrets: inherit

  backend-deploy-dev:
    needs: backend-build-dev
    if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
    uses: ./.github/workflows/_backend-deploy.yml
    with:
      environment: dev
      image_tag: ${{ github.sha }}
    secrets: inherit

  backend-deploy-prod:
    needs: backend-build-prod
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/_backend-deploy.yml
    with:
      environment: prod
      image_tag: ${{ needs.backend-build-prod.outputs.image_tag || needs.versioning.outputs.new-version }}
    secrets: inherit
  
  frontend-build:
    needs: sonarqube
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.ref == 'refs/heads/dev' && github.event_name == 'push'
    uses: ./.github/workflows/_frontend-build.yml
    with:
      profile: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    secrets: inherit

  frontend-submit:
    needs: frontend-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/_frontend-submit.yml
    secrets: inherit
